    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>rdzeń — Twój rytm</title>
    <script type="module" crossorigin src="/rdze-app/assets/index-Cvv7Pipm.js"></script>
    <link rel="stylesheet" crossorigin href="/rdze-app/assets/index-By0_ttep.css">
  </head>
  <body>
    <script>
      (function () {
        var saved = localStorage.getItem('rdzen-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/rdze-app/sw.js', { scope: '/rdze-app/' })
            .then((reg) => {
              // Nie czekamy biernie az przegladarka sama zauwazy nowa wersje
              // (bywa leniwa, sprawdza raz na kilkanascie godzin) - wymuszamy
              // sprawdzenie teraz i za kazdym powrotem do appki.
              reg.update();
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') reg.update();
              });
            })
            .catch(() => undefined);
        });
        // Gdy nowa wersja Service Workera przejmie kontrole (po deployu),
        // odswiez strone automatycznie - bez tego appka na telefonie
        // pokazywalaby stara wersje az do recznego zamkniecia i otwarcia.
        let refreshed = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshed) return;
          refreshed = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
